version: 2

updates:
  # Without grouping, dependabot files one PR per package. That produced a
  # backlog of 21 open PRs, none of them individually mergeable, because the
  # direct-dependency upgrades needed source changes the others also required.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Transitive and dev-tooling churn: the bulk of the noise, and safe to
      # review as a single lockfile diff.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Runtime dependencies still get grouped for non-breaking updates, but
      # stay separate from dev tooling so a regression is easier to bisect.
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    # Majors are deliberately left ungrouped: each one gets its own PR, because
    # each one needs its own migration and its own verification.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
